<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nove's Calculator</title>
    <style>
        body { font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background: #eef2f3; margin: 0; }
        .calculator { background: #1e1e1e; padding: 20px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); width: 300px; }
        #screen { width: 100%; height: 60px; background: #2d2d2d; color: #fff; border: none; font-size: 2rem; text-align: right; padding: 10px; box-sizing: border-box; border-radius: 10px; margin-bottom: 20px; }
        .buttons { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
        button { padding: 20px; font-size: 1.25rem; font-weight: bold; border: none; border-radius: 50%; cursor: pointer; transition: background 0.2s; }
        button:active { transform: scale(0.95); }
        .num { background: #3d3d3d; color: white; }
        .op { background: #ff9f0a; color: white; }
        .clear { background: #a5a5a5; color: black; }
    </style>
</head>
<body>

    <div class="calculator">
        <!-- Form that sends information back to our Python server -->
        <form method="POST">
            <!-- Hidden input to save and send the current math string -->
            <input type="text" id="screen" name="display" readonly value="{{ result if result else '0' }}">
            
            <div class="buttons">
                <button type="submit" name="button" value="C" class="clear">C</button>
                <button type="submit" name="button" value="(" class="num">(</button>
                <button type="submit" name="button" value=")" class="num">)</button>
                <button type="submit" name="button" value="/" class="op">÷</button>
                
                <button type="submit" name="button" value="7" class="num">7</button>
                <button type="submit" name="button" value="8" class="num">8</button>
                <button type="submit" name="button" value="9" class="num">9</button>
                <button type="submit" name="button" value="*" class="op">×</button>
                
                <button type="submit" name="button" value="4" class="num">4</button>
                <button type="submit" name="button" value="5" class="num">5</button>
                <button type="submit" name="button" value="6" class="num">6</button>
                <button type="submit" name="button" value="-" class="op">-</button>
                
                <button type="submit" name="button" value="1" class="num">1</button>
                <button type="submit" name="button" value="2" class="num">2</button>
                <button type="submit" name="button" value="3" class="num">3</button>
                <button type="submit" name="button" value="+" class="op">+</button>
                
                <button type="submit" name="button" value="0" class="num" style="grid-column: span 2; border-radius: 30px;">0</button>
                <button type="submit" name="button" value="." class="num">.</button>
                <button type="submit" name="button" value="=" class="op">=</button>
            </div>
        </form>
    </div>

</body>
</html>
